<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GreenTrack • Custom AI Doctor</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { brand: { 50: '#ecfdf5', 100: '#d1fae5', 500: '#10b981', 600: '#059669', 900: '#064e3b' } } } }
    }
  </script>

  <style>
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #10b981; border-radius: 4px; }
    .custom-tree-icon {
        background-color: #059669; color: white; border-radius: 50%; border: 2px solid white;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3); transition: transform 0.2s;
    }
    .custom-tree-icon:hover { transform: scale(1.1); background-color: #047857; }
    .custom-tree-icon::after {
        content: ''; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%);
        border-width: 6px 6px 0; border-style: solid; border-color: #059669 transparent transparent transparent;
    }
    .animate-enter { animation: fade-in 0.3s ease-out forwards; }
    @keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased min-h-screen flex flex-col">

  <nav class="bg-white/90 backdrop-blur-md sticky top-0 z-50 border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16">
        <div class="flex items-center gap-2">
          <div class="bg-brand-500 text-white p-2 rounded-lg"><i class="fa-solid fa-brain text-xl"></i></div>
          <span class="font-bold text-xl tracking-tight text-gray-900">GreenTrack <span class="text-xs text-purple-600 bg-purple-100 px-2 py-0.5 rounded-full ml-1">Custom AI</span></span>
        </div>
        <div class="flex items-center gap-4">
          <div id="ai-status" class="text-xs font-mono text-gray-400 flex items-center gap-1"><i class="fa-solid fa-circle-notch fa-spin"></i> Loading AI...</div>
          <button onclick="toggleView('dashboard')" class="text-sm font-medium hover:text-brand-600 hidden md:block">Dashboard</button>
          <button onclick="toggleView('map-view')" class="text-sm font-medium hover:text-brand-600 hidden md:block">Map</button>
          <button onclick="openRegisterModal()" class="bg-brand-600 hover:bg-brand-700 text-white px-4 py-2 rounded-full text-sm font-medium shadow-lg flex items-center gap-2"><i class="fa-solid fa-plus"></i> Plant New</button>
        </div>
      </div>
    </div>
  </nav>

  <main class="flex-grow container mx-auto px-4 py-6 max-w-7xl space-y-6">

    <div id="dashboard" class="space-y-6 animate-enter">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100"><p class="text-gray-400 text-xs font-bold uppercase">Total Trees</p><p class="text-2xl font-bold text-gray-800" id="stat-total">0</p></div>
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100"><p class="text-gray-400 text-xs font-bold uppercase">Survival Rate</p><p class="text-2xl font-bold text-brand-600" id="stat-survival">0%</p></div>
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100"><p class="text-gray-400 text-xs font-bold uppercase">CO₂ Offset (kg)</p><p class="text-2xl font-bold text-teal-600" id="stat-carbon">0.0</p></div>
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100"><p class="text-gray-400 text-xs font-bold uppercase">Guardians</p><p class="text-2xl font-bold text-amber-500" id="stat-users">0</p></div>
      </div>

      <div class="grid lg:grid-cols-3 gap-6">
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 h-fit">
          <h3 class="font-bold text-gray-800 mb-4 flex items-center gap-2"><i class="fa-solid fa-trophy text-yellow-500"></i> Leaderboard</h3>
          <div class="space-y-3" id="leaderboardList"></div>
        </div>

        <div class="lg:col-span-2 bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
          <div class="p-6 border-b border-gray-100 flex justify-between items-center"><h3 class="font-bold text-gray-800">Recent Updates</h3><button onclick="toggleView('map-view')" class="text-brand-600 text-sm font-bold">Map &rarr;</button></div>
          <div class="overflow-x-auto">
            <table class="w-full text-sm text-left"><thead class="bg-gray-50 text-gray-500 uppercase text-xs"><tr><th class="px-6 py-3">Tree</th><th class="px-6 py-3">Location</th><th class="px-6 py-3">Status</th><th class="px-6 py-3 text-right">Action</th></tr></thead><tbody id="treeTable" class="divide-y divide-gray-100"></tbody></table>
          </div>
        </div>
      </div>
    </div>

    <div id="map-view" class="hidden h-[600px] bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden relative">
      <div id="map" class="w-full h-full z-0"></div>
      <div class="absolute top-4 right-4 z-[400] bg-white p-2 rounded-lg shadow-lg"><button onclick="locateUser()" class="p-2 hover:bg-gray-100 rounded text-gray-600"><i class="fa-solid fa-crosshairs"></i></button></div>
    </div>
  </main>

  <div id="addTreeModal" class="fixed inset-0 z-[1000] hidden bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-lg shadow-2xl overflow-hidden animate-enter">
      <div class="bg-brand-600 p-4 text-white flex justify-between items-center"><h3 class="font-bold"><i class="fa-solid fa-seedling mr-2"></i> Register Tree</h3><button onclick="closeModal('addTreeModal')"><i class="fa-solid fa-xmark"></i></button></div>
      <form id="treeForm" class="p-6 space-y-5">
        <div><label class="block text-xs font-bold text-gray-500 uppercase mb-1">Tree Name</label><input type="text" id="inpName" required placeholder="e.g. Neem Sapling" class="w-full bg-gray-50 border rounded-lg px-3 py-2 outline-none focus:border-brand-500"></div>
        <div><label class="block text-xs font-bold text-gray-500 uppercase mb-1">Location</label><div class="flex gap-2"><input type="text" id="inpAddress" readonly required placeholder="Click 'Get GPS'" class="w-full bg-gray-50 border rounded-lg px-3 py-2 text-gray-600 text-sm"><button type="button" onclick="getGPS()" class="bg-gray-800 text-white px-3 py-2 rounded-lg hover:bg-black transition text-xs font-bold whitespace-nowrap flex items-center gap-2"><i class="fa-solid fa-location-crosshairs"></i> Get GPS</button></div></div>
        <div><label class="block text-xs font-bold text-gray-500 uppercase mb-1">Planter</label><input type="text" id="inpPlanter" required placeholder="Your Name" class="w-full bg-gray-50 border rounded-lg px-3 py-2 outline-none focus:border-brand-500"></div>
        <button type="submit" class="w-full bg-brand-600 text-white font-bold py-3 rounded-xl hover:bg-brand-700 transition">Confirm</button>
      </form>
    </div>
  </div>

  <div id="detailsModal" class="fixed inset-0 z-[1000] hidden bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-3xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh] animate-enter">
      <div class="bg-gray-900 text-white p-6 flex justify-between items-start">
        <div class="flex gap-4"><div class="w-14 h-14 bg-brand-500 rounded-2xl flex items-center justify-center text-3xl shadow-lg">🌳</div><div><h2 class="text-2xl font-bold" id="detName">Tree Name</h2><div class="flex gap-2 text-sm text-gray-400 mt-1"><i class="fa-solid fa-location-dot"></i> <span id="detLocation">Loading...</span></div></div></div>
        <button onclick="closeModal('detailsModal')" class="bg-white/10 p-2 rounded-full hover:bg-white/20"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="flex flex-col md:flex-row h-full overflow-hidden">
        <div class="flex-1 p-6 overflow-y-auto border-r border-gray-100">
          <div class="flex justify-between items-center mb-6">
            <h4 class="font-bold text-gray-800">Growth History</h4>
            <label class="bg-purple-600 hover:bg-purple-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold cursor-pointer transition flex items-center gap-2 shadow-lg">
              <i class="fa-solid fa-wand-magic-sparkles"></i> Custom AI Check
              <input type="file" accept="image/*" class="hidden" id="verifyInput" onchange="handleCustomAI(this)">
            </label>
          </div>
          <div id="detTimeline" class="space-y-6 border-l-2 border-gray-100 ml-2 pl-6 relative"></div>
        </div>
        <div class="w-full md:w-80 bg-gray-50 p-6 flex flex-col items-center text-center">
          <div class="bg-white p-4 rounded-xl shadow-sm mb-4 border border-gray-100"><div id="qrcode"></div></div>
          <p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">Tree ID Token</p>
          <div class="mb-4"><span id="detStatus" class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wide">Alive</span></div>
          <div id="aiTipCard" class="w-full bg-blue-50 p-4 rounded-xl border border-blue-100 text-left hidden"><div class="flex items-center gap-2 mb-2"><i class="fa-solid fa-robot text-blue-500"></i><span class="text-xs font-bold text-blue-700 uppercase">AI Diagnosis:</span></div><p id="aiTipText" class="text-sm text-blue-900 leading-snug"></p></div>
        </div>
      </div>
    </div>
  </div>

  <img id="aiPreview" class="hidden" width="224" height="224" crossorigin="anonymous">

  <script>
    /* -------------------------------------------------------------------------- */
    /* ⚠️ YOUR CUSTOM AI MODEL HERE                                               */
    /* -------------------------------------------------------------------------- */
    // If you trained a model, paste the URL here. 
    // If you leave this as is, it uses a generic 'Plant Disease' model I found.
    // BUT FOR THE HACKATHON, TRAIN YOUR OWN AND PASTE IT!
    const URL = "https://teachablemachine.withgoogle.com/models/dxd5v1SZf/"; 

    let trees = JSON.parse(localStorage.getItem('greenTrackData_v7')) || [];
    let map, markers = [], tempCoords = null, selectedTreeId = null, model = null, maxPredictions = 0;

    window.onload = () => { initMap(); initAI(); renderApp(); };

    /* 1. CUSTOM AI SETUP */
    async function initAI() {
      try {
        const modelURL = URL + "model.json";
        const metadataURL = URL + "metadata.json";
        model = await tmImage.load(modelURL, metadataURL);
        maxPredictions = model.getTotalClasses();
        document.getElementById('ai-status').innerHTML = `<span class="text-purple-600 font-bold">● AI Online</span>`;
      } catch (e) {
        console.error("AI Error:", e);
        document.getElementById('ai-status').innerText = "AI Offline (Check URL)";
      }
    }

    /* 2. HANDLE CUSTOM AI PREDICTION */
    async function handleCustomAI(input) {
      if (!model) return alert("AI Model not loaded. Check your internet or URL.");
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = e => {
          const img = document.getElementById('aiPreview');
          img.src = e.target.result;
          img.onload = async () => {
            alert("🔮 Custom AI is analyzing...");
            
            // PREDICT
            const prediction = await model.predict(img);
            
            // Find highest probability
            let bestClass = prediction[0];
            for (let i = 0; i < maxPredictions; i++) {
                if (prediction[i].probability > bestClass.probability) {
                    bestClass = prediction[i];
                }
            }

            const className = bestClass.className;
            const probability = (bestClass.probability * 100).toFixed(1);

            console.log("Prediction:", className, probability);

            let status = "Alive";
            let tip = "Looks healthy!";
            let color = "bg-green-50 border-green-200 text-green-900";

            // LOGIC based on Teachable Machine Classes
            // Ideally your classes are: "Healthy", "Dead", "Not a Tree"
            if (className.toLowerCase().includes("dead") || className.toLowerCase().includes("bad") || className.toLowerCase().includes("brown")) {
                status = "Needs Attention";
                tip = "AI detected issues (Dead/Dry). Water immediately!";
                color = "bg-red-50 border-red-200 text-red-900";
            } else if (className.toLowerCase().includes("not") || className.toLowerCase().includes("noise")) {
                alert(`❌ AI says: This is '${className}'. Please take a photo of the tree.`);
                return;
            }

            // Save
            const tree = trees.find(t => t.id === selectedTreeId);
            tree.history.push({
              date: new Date().toISOString(),
              type: 'AI Scan',
              note: `Result: ${className} (${probability}%)`,
              icon: 'fa-wand-magic-sparkles',
              aiVerified: true,
              health: status
            });
            tree.status = status;
            localStorage.setItem('greenTrackData_v7', JSON.stringify(trees));
            
            viewTree(selectedTreeId);

            // Show Result
            const tipCard = document.getElementById('aiTipCard');
            document.getElementById('aiTipText').innerText = `${tip}`;
            tipCard.classList.remove('hidden');
            tipCard.className = `w-full p-4 rounded-xl border text-left mt-4 animate-enter ${color}`;
            
            alert(`✅ AI Result: ${className} (${probability}%)`);
          }
        }
        reader.readAsDataURL(input.files[0]);
      }
    }

    /* 3. MAPPING & GPS */
    function initMap() {
      map = L.map('map').setView([13.0827, 80.2707], 11);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { attribution: '© OpenStreetMap' }).addTo(map);
      map.on('click', async e => {
        const popup = L.popup().setLatLng(e.latlng).setContent("Fetching Address...").openOn(map);
        const address = await getAddressFromCoords(e.latlng.lat, e.latlng.lng);
        tempCoords = { lat: e.latlng.lat, lng: e.latlng.lng, address };
        popup.setContent(`<div class="text-center"><p class="text-xs text-gray-500 mb-2">${address}</p><button onclick="openRegisterModal(true)" class="bg-brand-600 text-white font-bold px-4 py-2 rounded">📍 Plant Here</button></div>`);
      });
    }

    async function getAddressFromCoords(lat, lng) {
        try {
            const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`);
            const d = await r.json();
            return [d.address.road, d.address.suburb, d.address.city].filter(Boolean).join(', ') || "Unknown Loc";
        } catch { return `${lat.toFixed(4)}, ${lng.toFixed(4)}`; }
    }

    async function getGPS() {
      const btn = document.querySelector('button[onclick="getGPS()"]');
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i>`;
      if(navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(async pos => {
          const { latitude: lat, longitude: lng } = pos.coords;
          const address = await getAddressFromCoords(lat, lng);
          tempCoords = { lat, lng, address };
          document.getElementById('inpAddress').value = address;
          btn.innerHTML = `<i class="fa-solid fa-check"></i>`;
        }, () => alert("GPS Error"));
      } else alert("No GPS support");
    }

    /* 4. APP LOGIC */
    document.getElementById('treeForm').addEventListener('submit', (e) => {
      e.preventDefault();
      if(!tempCoords) { alert("Get GPS first!"); return; }
      trees.push({
        id: Date.now(),
        name: document.getElementById('inpName').value,
        planter: document.getElementById('inpPlanter').value,
        lat: tempCoords.lat, lng: tempCoords.lng, address: tempCoords.address,
        date: new Date().toISOString(), status: "Alive",
        history: [{ date: new Date().toISOString(), type: 'Planted', note: 'Initial plantation', icon: 'fa-seedling', aiVerified: false }]
      });
      localStorage.setItem('greenTrackData_v7', JSON.stringify(trees));
      e.target.reset(); tempCoords = null; closeModal('addTreeModal'); renderApp(); toggleView('dashboard');
    });

    function renderApp() {
      document.getElementById('stat-total').innerText = trees.length;
      const aliveCount = trees.filter(t => t.status !== "Needs Attention").length;
      document.getElementById('stat-survival').innerText = trees.length ? Math.round((aliveCount/trees.length)*100)+"%" : "0%";
      
      markers.forEach(m => map.removeLayer(m)); markers = [];
      const icon = L.divIcon({ html: `<div class="custom-tree-icon w-8 h-8"><i class="fa-solid fa-tree text-sm"></i></div>`, className: 'bg-transparent', iconSize: [32, 32], iconAnchor: [16, 38], popupAnchor: [0, -40] });
      trees.forEach(t => {
        markers.push(L.marker([t.lat, t.lng], { icon }).addTo(map).bindPopup(`<div class="text-center"><b class="text-brand-700">${t.name}</b><br><span class="text-xs text-gray-500">${t.address}</span><br><button onclick="viewTree(${t.id})" class="mt-2 bg-brand-600 text-white text-xs font-bold px-3 py-1 rounded">View Details</button></div>`));
      });

      const tbody = document.getElementById('treeTable'); tbody.innerHTML = '';
      [...trees].reverse().forEach(t => {
        tbody.innerHTML += `<tr class="hover:bg-gray-50 border-b border-gray-50"><td class="px-6 py-4 font-medium">${t.name}</td><td class="px-6 py-4 text-xs text-gray-500 truncate max-w-[150px]">${t.address}</td><td class="px-6 py-4"><span class="${t.status === 'Needs Attention' ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'} px-2 py-1 rounded text-xs font-bold">${t.status}</span></td><td class="px-6 py-4 text-right"><button onclick="viewTree(${t.id})" class="text-gray-400 hover:text-brand-600 px-2 py-1 border rounded"><i class="fa-solid fa-eye"></i> View</button></td></tr>`;
      });
      
      const counts = {}; trees.forEach(t => counts[t.planter] = (counts[t.planter]||0)+1);
      const sorted = Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,5);
      document.getElementById('leaderboardList').innerHTML = sorted.map(([n,c], i) => `<div class="flex justify-between text-sm items-center py-2 border-b border-gray-50"><span class="flex items-center gap-2"><span class="font-bold text-gray-300">#${i+1}</span> ${n}</span><span class="font-bold text-brand-600">${c} Trees</span></div>`).join('');
    }

    function viewTree(id) {
      selectedTreeId = id;
      const t = trees.find(tr => tr.id === id);
      document.getElementById('detName').innerText = t.name;
      document.getElementById('detLocation').innerText = t.address;
      document.getElementById('detStatus').innerText = t.status;
      document.getElementById('aiTipCard').classList.add('hidden');
      const tl = document.getElementById('detTimeline'); tl.innerHTML = '';
      [...t.history].reverse().forEach(h => {
        let statusColor = h.health === 'Needs Attention' ? 'text-red-600' : 'text-green-600';
        tl.innerHTML += `
          <div class="mb-6 relative">
            <span class="absolute -left-9 w-6 h-6 rounded-full flex items-center justify-center text-xs border-2 border-white shadow-sm ${h.aiVerified ? 'bg-purple-100 text-purple-600' : 'bg-gray-100 text-gray-400'}"><i class="fa-solid ${h.icon}"></i></span>
            <div class="bg-gray-50 p-3 rounded-lg border ${h.aiVerified ? 'border-purple-200 bg-purple-50/30' : 'border-gray-100'}">
              <div class="flex justify-between items-start"><span class="font-bold text-sm text-gray-800">${h.type}</span><span class="text-xs text-gray-400">${new Date(h.date).toLocaleDateString()}</span></div>
              <p class="text-xs text-gray-600 mt-1">${h.note}</p>
            </div>
          </div>`;
      });
      document.getElementById("qrcode").innerHTML = "";
      new QRCode(document.getElementById("qrcode"), { text: `TreeID:${t.id}`, width: 100, height: 100, colorDark : "#059669" });
      openModal('detailsModal');
    }

    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    function openRegisterModal(x) { document.getElementById('addTreeModal').classList.remove('hidden'); if(x&&tempCoords) document.getElementById('inpAddress').value = tempCoords.address; }
    function toggleView(id) { ['dashboard','map-view'].forEach(v => document.getElementById(v).classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); if(id === 'map-view') setTimeout(() => map.invalidateSize(), 100); }
    function locateUser() { if(navigator.geolocation) navigator.geolocation.getCurrentPosition(p => map.flyTo([p.coords.latitude, p.coords.longitude], 13)); }
  </script>
</body>
</html>
